<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Heart Disease Prediction - AI-Powered Risk Assessment" />
    <meta name="theme-color" content="#667eea" />
    <meta name="og:title" content="Heart Disease Prediction" />
    <meta name="og:description" content="AI-Powered Heart Disease Risk Assessment" />
    
    <title>🏥 Heart Disease Prediction</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🏥</text></svg>" />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body, #root {
        height: 100%;
        width: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      #root {
        display: flex;
        flex-direction: column;
      }

      /* Loading spinner */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
    </style>
  </head>
  
  <body>
    <div id="root">
      <div style="
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: white;
        flex-direction: column;
        gap: 20px;
      ">
        <div class="loading-spinner"></div>
        <p style="font-size: 18px; font-weight: 500;">Loading Heart Disease Prediction App...</p>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

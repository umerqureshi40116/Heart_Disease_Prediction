version: '3.8'

services:
  # ========================================================================
  # FASTAPI BACKEND
  # ========================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heart-disease-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heart-disease-network
    depends_on:
      - db

  # ========================================================================
  # REACT FRONTEND
  # ========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heart-disease-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev
    networks:
      - heart-disease-network
    depends_on:
      api:
        condition: service_healthy

  # ========================================================================
  # DATABASE (Optional - for future features)
  # ========================================================================
  db:
    image: postgres:15.4-alpine
    container_name: heart-disease-db
    environment:
      POSTGRES_DB: heart_disease
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - heart-disease-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d heart_disease"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # NGINX REVERSE PROXY (Optional - for production)
  # ========================================================================
  nginx:
    image: nginx:latest
    container_name: heart-disease-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - heart-disease-network
    profiles:
      - production

# ========================================================================
# NETWORKS
# ========================================================================
networks:
  heart-disease-network:
    driver: bridge

# ========================================================================
# VOLUMES
# ========================================================================
volumes:
  postgres_data:
    driver: local

# ========================================================================
# USAGE
# ========================================================================
# Development:
#   docker-compose up
#
# Production:
#   docker-compose --profile production up
#
# Specific service:
#   docker-compose up api
#   docker-compose up frontend
#
# Rebuild:
#   docker-compose build --no-cache
#
# Logs:
#   docker-compose logs -f api
#   docker-compose logs -f frontend
#
# Stop:
#   docker-compose down
#   docker-compose down -v  # Also remove volumes